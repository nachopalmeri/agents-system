name: Validate agents

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate agent registry
        shell: pwsh
        run: ./bin/validate-agents.ps1

      - name: Validate installation diagnostics
        shell: pwsh
        run: |
          ./bin/test-installation-diagnostics.ps1
          ./bin/test-skill-inventory.ps1
          ./bin/test-vault-resolution.ps1

      - name: Validate shared-shell exit contract
        shell: pwsh
        run: ./bin/test-ci-exit-contract.ps1

      - name: Validate ticket-session workflow contract
        shell: pwsh
        run: ./bin/test-ticket-session-workflow.ps1

      - name: Validate OpenCode guard exports
        run: node --test bin/test-opencode-guard.mjs

      - name: Validate delegation policy
        shell: pwsh
        run: |
          ./bin/test-delegation.ps1
          ./bin/test-model-routing.ps1
          ./bin/render-runtime-adapters.ps1 -Check

      - name: Validate runtime graph and routing
        shell: pwsh
        run: |
          ./bin/check-runtime-graph.ps1
          ./bin/test-task-routing.ps1

      - name: Check skills-library index
        shell: pwsh
        run: ./bin/generate-skill-index.ps1 -Check

      - name: Check generated agents and commands
        shell: pwsh
        run: |
          ./bin/render-agents.ps1 -Check
          ./bin/render-commands.ps1 -Check
