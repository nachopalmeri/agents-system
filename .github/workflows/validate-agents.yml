name: Validate agents

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate agent registry
        shell: pwsh
        run: ./bin/validate-agents.ps1

      - name: Check runtime graph
        shell: pwsh
        run: ./bin/check-runtime-graph.ps1

      - name: Check skills-library index
        shell: pwsh
        run: ./bin/generate-skill-index.ps1 -Check

      - name: Check generated agents and commands
        shell: pwsh
        run: |
          ./bin/render-agents.ps1 -Check
          ./bin/render-commands.ps1 -Check
